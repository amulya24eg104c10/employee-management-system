server.port=${PORT:8080}

# Database (override with env vars when deployed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ems_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list of frontend URLs allowed to call the API (* = any)
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Admin account created on first start
app.admin.username=${ADMIN_USER:amulya}
app.admin.password=${ADMIN_PASSWORD:123456789}
